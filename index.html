<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabi — İngilizce Kelime Widget</title>
<style>
  :root{ --bg:#F7F9FA; --surface:#FFFFFF; --text:#0F1C1E; --muted:#53646A; --accent:#0E7C86; --border:#E2E8EA; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0C1416; --surface:#152024; --text:#EAF2F3; --muted:#9AB0B5; --accent:#3FB6BE; --border:#24353A; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:480px;margin:20px;padding:40px 28px;text-align:center}
  .mark{width:92px;height:92px;border-radius:22px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#14868F,#0A4C55);color:#fff;font-size:52px;font-weight:800;position:relative}
  .mark::after{content:"";position:absolute;top:14px;width:16px;height:16px;border-radius:50%;background:#F0A83C}
  h1{font-size:30px;margin:0 0 6px;color:var(--accent);letter-spacing:-0.5px}
  p{color:var(--muted);margin:0 0 28px}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none;font-weight:600;border:1px solid var(--border);
    background:var(--surface);border-radius:12px;padding:10px 18px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">V</div>
    <h1>Vokabi</h1>
    <p>Kilit ekranında İngilizce kelime öğren.<br>Learn English words on your lock screen.</p>
    <div class="links">
      <a href="privacy.html">Gizlilik / Privacy</a>
      <a href="support.html">Destek / Support</a>
    </div>
  </div>
</body>
</html>
